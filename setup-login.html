<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>ふたりのホームページ · ログイン確認</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; background: #fff2f6; color: #4a3440; font-family: system-ui,sans-serif; padding: 24px 16px; }
    main { max-width: 560px; margin: 6vh auto; background: #fff; border-radius: 24px; padding: 28px; box-shadow: 0 8px 32px #9a43651a; }
    h1 { font-size: 1.5rem; color: #a62259; }
    p { line-height: 1.8; }
    button { display: block; width: 100%; margin: 16px 0; padding: 14px 20px; border: 0; border-radius: 14px; font-size: 1rem; background: #b62d65; color: white; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    button:focus-visible,input:focus-visible { outline: 3px solid #752eae; outline-offset: 3px; }
    input { width: 100%; padding: 12px; border: 1px solid #dcacc1; border-radius: 10px; font: .95rem ui-monospace,monospace; }
    .note { font-size: .9rem; color: #6c5862; }
    #account { overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h1>ふたりのログイン確認♡</h1>
  <p>これからサイトで使う、自分のGoogleアカウントでログインしてね。</p>
  <p class="note">このページはログインとアカウントの確認だけを行います。写真・日記・カウンターは読み込まず、変更もしません。ログインしただけでは、まだサイトの利用許可は付きません。</p>
  <p id="status" role="status" aria-live="polite">ログインの準備をしています…</p>
  <button id="login" disabled>Googleでログイン</button>
  <section id="result" hidden aria-label="確認できたアカウント">
    <p id="account"></p>
    <label for="uid">このサイト用のUID</label>
    <input id="uid" readonly autocomplete="off" spellcheck="false">
    <p class="note">表示されたUIDを、サイトの設定を進めている相手に伝えてください。Googleのパスワードや確認コードを送る必要はありません。</p>
    <button id="logout">ログアウト</button>
  </section>
  <p class="note">使うアカウントを間違えたときは、ログアウトして入り直せます。共有端末では、確認が終わったらログアウトしてこのタブを閉じてください。</p>
  <noscript><p>ログイン確認にはJavaScriptが必要です。</p></noscript>
</main>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, GoogleAuthProvider, onAuthStateChanged, setPersistence, inMemoryPersistence, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  // Public Firebase Web identifiers. No database SDK or database reads/writes.
  const auth = getAuth(initializeApp({
    apiKey: "AIzaSyDTblb_F8TYSloI-WcKrXGCtQdDFFGTx3k",
    authDomain: "hutari-3a6c1.firebaseapp.com",
    projectId: "hutari-3a6c1",
    appId: "1:637601321157:web:93c60f5dc40ba66c61a0ac"
  }, "hutari-enrollment"));
  const byId = (id) => document.getElementById(id);
  const clear = () => {
    byId("result").hidden = true;
    byId("uid").value = "";
    byId("account").textContent = "";
  };
  try {
    await setPersistence(auth, inMemoryPersistence);
    byId("status").textContent = "自分のGoogleアカウントを選んでね。";
    byId("login").disabled = false;
  } catch {
    byId("status").textContent = "ログインの準備ができませんでした。再読み込みしてください。";
  }
  onAuthStateChanged(auth, (user) => {
    clear();
    byId("login").hidden = Boolean(user);
    if (!user) return;
    byId("account").textContent = `ログインしたアカウント: ${user.email || user.displayName || "Googleアカウント"}`;
    byId("uid").value = user.uid;
    byId("result").hidden = false;
    byId("status").textContent = "ログインを確認できました。このアカウントを使うか確認してね。";
  }, () => {
    clear();
    byId("status").textContent = "ログイン状態を確認できませんでした。再読み込みしてください。";
  });
  byId("login").addEventListener("click", async () => {
    byId("login").disabled = true;
    try {
      const provider = new GoogleAuthProvider();
      provider.setCustomParameters({ prompt: "select_account" });
      await signInWithPopup(auth, provider);
    } catch (error) {
      byId("status").textContent = error.code === "auth/popup-closed-by-user"
        ? "ログインをキャンセルしました。もう一度試せます。"
        : "ログインできませんでした。ポップアップの許可とアカウントを確認して、もう一度試してください。";
    } finally { byId("login").disabled = false; }
  });
  byId("logout").addEventListener("click", async () => {
    byId("logout").disabled = true;
    clear();
    try {
      await signOut(auth);
      clear();
      byId("status").textContent = "ログアウトしました。";
    } catch { byId("status").textContent = "ログアウトを完了できませんでした。このタブを閉じてください。"; }
    finally { byId("logout").disabled = false; }
  });
  window.addEventListener("pagehide", clear);
  window.addEventListener("pageshow", (event) => { if (event.persisted) location.reload(); });
</script>
</body>
</html>
