<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アルバム</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:sans-serif;
  background:linear-gradient(180deg,#fff1f6,#ffe6ef);
  color:#333;
  overflow-x:hidden;
}

.heart-bg{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:0;
}

.heart{
  position:absolute;
  color:rgba(255,105,150,.35);
  font-size:24px;
  animation:floatHeart 10s linear infinite;
}

@keyframes floatHeart{
  0%{transform:translateY(100vh) scale(.8);opacity:0}
  15%{opacity:1}
  100%{transform:translateY(-120px) scale(1.5);opacity:0}
}

header{
  position:relative;
  z-index:1;
  background:linear-gradient(135deg,#ff9db8,#ff76a3);
  color:white;
  text-align:center;
  padding:18px;
  font-size:26px;
  font-weight:bold;
}

.container{
  position:relative;
  z-index:1;
  max-width:900px;
  margin:auto;
  padding:12px;
}

.card{
  background:rgba(255,255,255,.92);
  border-radius:22px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 6px 18px rgba(255,120,160,.15);
}

button{
  border:none;
  border-radius:15px;
  padding:10px 18px;
  background:linear-gradient(135deg,#ff8fab,#ff5f93);
  color:white;
  cursor:pointer;
  font-size:16px;
}

input[type="text"]{
  width:100%;
  padding:10px;
  border-radius:12px;
  border:1px solid #ddd;
  margin-top:10px;
}

.filter-active{
  background:linear-gradient(135deg,#ffd700,#ffb700) !important;
  color:#333;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.05)}
  100%{transform:scale(1)}
}

.album-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:12px;
}

.photo-card{
  background:#fff7fa;
  border-radius:18px;
  padding:10px;
}

.photo-card img{
  width:100%;
  border-radius:12px;
  cursor:pointer;
}

.comment{
  margin:10px 0;
  white-space:pre-wrap;
}

.actions{
  display:flex;
  justify-content:space-between;
  gap:6px;
}

.favorite{
  background:#ffcc66;
  color:#333;
}

.delete{
  background:#ccc;
  color:#333;
}

.preview{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.preview img{
  max-width:90%;
  max-height:90%;
  border-radius:15px;
}
</style>
</head>

<body>

<div class="heart-bg">
  <div class="heart" style="left:5%;animation-delay:0s;">♡</div>
  <div class="heart" style="left:20%;animation-delay:2s;">❤</div>
  <div class="heart" style="left:40%;animation-delay:4s;">♡</div>
  <div class="heart" style="left:60%;animation-delay:1s;">❤</div>
  <div class="heart" style="left:80%;animation-delay:3s;">♡</div>
</div>

<header>📷 アルバム</header>

<div class="container">

<a href="index.html">
  <button>🏠 ホームへ戻る</button>
</a>

<div class="card">
  <h2>写真を追加</h2>

  <input type="file" id="photoInput" accept="image/*">

  <input type="text" id="commentInput" placeholder="コメントを書こう♡">

  <br><br>

  <button onclick="addPhoto()">追加する</button>
</div>

<div class="card">
  <button id="favoriteFilterBtn" onclick="toggleFavorites()">
    ☆ お気に入りのみ表示
  </button>
</div>

<div class="card">
  <div id="album" class="album-grid"></div>
</div>

</div>

<div class="preview" id="preview" onclick="closePreview()">
  <img id="previewImg">
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  set,
  update,
  remove,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDTblb_F8TYSloI-WcKrXGCtQdDFFGTx3k",
  authDomain: "hutari-3a6c1.firebaseapp.com",
  databaseURL: "https://hutari-3a6c1-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "hutari-3a6c1",
  storageBucket: "hutari-3a6c1.firebasestorage.app",
  messagingSenderId: "637601321157",
  appId: "1:637601321157:web:93c60f5dc40ba66c61a0ac",
  measurementId: "G-GJ45GRHSJ0"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const photosRef = ref(db, "photos");

let favoritesOnly = false;
let allPhotos = [];

window.addPhoto = function(){
  const file = document.getElementById("photoInput").files[0];

  if(!file){
    alert("写真を選んでね");
    return;
  }

  resizeImage(file, function(resizedImage){
    const newPhotoRef = push(photosRef);

    set(newPhotoRef,{
      image:resizedImage,
      comment:document.getElementById("commentInput").value,
      favorite:false,
      createdAt:Date.now()
    }).then(()=>{
      document.getElementById("photoInput").value = "";
      document.getElementById("commentInput").value = "";
      createHearts();
    }).catch((error)=>{
      alert("写真の追加に失敗したよ：" + error.message);
    });
  });
};

function resizeImage(file, callback){
  const reader = new FileReader();

  reader.onload = function(e){
    const img = new Image();

    img.onload = function(){
      const canvas = document.createElement("canvas");

      const maxSize = 700;

      let width = img.width;
      let height = img.height;

      if(width > height){
        if(width > maxSize){
          height = height * (maxSize / width);
          width = maxSize;
        }
      }else{
        if(height > maxSize){
          width = width * (maxSize / height);
          height = maxSize;
        }
      }

      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(img,0,0,width,height);

      const resizedImage =
      canvas.toDataURL("image/jpeg",0.65);

      callback(resizedImage);
    };

    img.src = e.target.result;
  };

  reader.readAsDataURL(file);
}

function renderPhotos(){
  const album = document.getElementById("album");
  album.innerHTML = "";

  const photosToShow =
  favoritesOnly
  ? allPhotos.filter(photo=>photo.favorite)
  : allPhotos;

  if(photosToShow.length === 0){
    album.innerHTML =
    '<p style="color:#999;text-align:center;">写真はまだありません♡</p>';
    return;
  }

  photosToShow.forEach((photo)=>{
    album.innerHTML += `
      <div class="photo-card">
        <img src="${photo.image}" onclick="openPreview('${photo.image}')">

        <div class="comment">
          ${escapeHtml(photo.comment || "")}
        </div>

        <div class="actions">
          <button class="favorite" onclick="toggleFavorite('${photo.key}', ${photo.favorite})">
            ${photo.favorite ? "⭐" : "☆"}
          </button>

          <button class="delete" onclick="deletePhoto('${photo.key}')">
            🗑️
          </button>
        </div>
      </div>
    `;
  });
}

window.toggleFavorite = function(key,current){
  update(ref(db,"photos/" + key),{
    favorite:!current
  });
};

window.deletePhoto = function(key){
  if(!confirm("削除する？")) return;

  remove(ref(db,"photos/" + key));
};

window.toggleFavorites = function(){
  favoritesOnly = !favoritesOnly;

  const btn = document.getElementById("favoriteFilterBtn");

  if(favoritesOnly){
    btn.classList.add("filter-active");
    btn.innerHTML = "⭐ お気に入り表示中";
  }else{
    btn.classList.remove("filter-active");
    btn.innerHTML = "☆ お気に入りのみ表示";
  }

  renderPhotos();
};

window.openPreview = function(src){
  document.getElementById("preview").style.display = "flex";
  document.getElementById("previewImg").src = src;
};

window.closePreview = function(){
  document.getElementById("preview").style.display = "none";
};

function escapeHtml(text){
  return String(text || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function createHearts(){
  for(let i=0;i<15;i++){
    const heart = document.createElement("div");

    heart.innerHTML =
    ["💖","💕","❤","✨"]
    [Math.floor(Math.random()*4)];

    heart.style.position = "fixed";
    heart.style.left = "50%";
    heart.style.top = "50%";
    heart.style.fontSize = (18+Math.random()*20)+"px";
    heart.style.zIndex = "9999";
    heart.style.pointerEvents = "none";

    document.body.appendChild(heart);

    const x = (Math.random()-0.5)*300;
    const y = -(80+Math.random()*250);

    heart.animate([
      {
        transform:"translate(-50%,-50%)",
        opacity:1
      },
      {
        transform:`translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`,
        opacity:0
      }
    ],{
      duration:1500,
      easing:"ease-out"
    });

    setTimeout(()=>{
      heart.remove();
    },1500);
  }
}

onValue(photosRef,(snapshot)=>{
  const data = snapshot.val() || {};

  allPhotos =
  Object.keys(data).map(key=>{
    return {
      key:key,
      ...data[key]
    };
  });

  allPhotos.sort((a,b)=>{
    return (b.createdAt || 0) - (a.createdAt || 0);
  });

  renderPhotos();
});
</script>

</body>
</html>
