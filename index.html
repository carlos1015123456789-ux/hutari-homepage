<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ふたりのホームページ</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:sans-serif;
  background:linear-gradient(180deg,#fff1f7,#ffe3ee);
  color:#333;
  text-align:center;
  overflow-x:hidden;
}

.heart-bg{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:0;
}

.bg-heart{
  position:absolute;
  bottom:-40px;
  color:rgba(255,90,140,.35);
  animation:floatUp linear infinite;
}

@keyframes floatUp{
  0%{transform:translateY(0) rotate(0deg);opacity:0}
  15%{opacity:1}
  100%{transform:translateY(-110vh) rotate(360deg);opacity:0}
}

.pop-heart{
  position:fixed;
  pointer-events:none;
  z-index:999;
  animation:popHeart 1s ease-out forwards;
  color:#ff4f86;
  font-size:26px;
}

@keyframes popHeart{
  0%{transform:translate(-50%,-50%) scale(.5);opacity:1}
  100%{transform:translate(-50%,-120px) scale(1.7);opacity:0}
}

header{
  position:relative;
  z-index:1;
  background:linear-gradient(135deg,#ff9fbd,#ff6f9f);
  padding:18px 10px;
  color:white;
  font-size:22px;
  font-weight:bold;
}

.container{
  position:relative;
  z-index:1;
  max-width:760px;
  margin:auto;
  padding:12px;
}

.card{
  background:rgba(255,255,255,.92);
  border-radius:22px;
  padding:15px;
  margin:10px 0;
  box-shadow:0 6px 18px rgba(255,120,160,.18);
}

.card h2{
  margin:4px 0 10px;
  font-size:22px;
  white-space:nowrap;
}

.card p{
  margin:6px 0;
  font-size:16px;
}

.top-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.days,.counter{
  font-size:36px;
  font-weight:bold;
  color:#ff4f86;
  margin:8px 0;
}

button{
  border:none;
  border-radius:16px;
  padding:10px 18px;
  font-size:16px;
  cursor:pointer;
  background:linear-gradient(135deg,#ff8fab,#ff5f93);
  color:white;
  margin:4px;
  box-shadow:0 5px 12px rgba(255,100,150,.25);
}

.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.menu a{text-decoration:none}

.menu button{
  width:100%;
  min-height:58px;
  font-size:18px;
}

input{
  padding:12px;
  border-radius:14px;
  border:1px solid #ddd;
  font-size:16px;
  width:80%;
  max-width:300px;
}

.hidden{display:none}

.error{color:#ff4f7a}

.message{
  border:1px solid #ffc3d6;
  color:#ff5f93;
  font-weight:bold;
}

@media(max-width:600px){
  header{
    font-size:21px;
    padding:17px 8px;
  }

  .container{
    padding:10px;
  }

  .card{
    padding:13px;
    margin:9px 0;
    border-radius:20px;
  }

  .card h2{
    font-size:19px;
  }

  .card p{
    font-size:15px;
  }

  .days,.counter{
    font-size:33px;
  }

  .top-grid{
    gap:8px;
  }

  button{
    font-size:15px;
    padding:9px 15px;
  }

  .menu button{
    min-height:52px;
    font-size:17px;
  }
}
</style>
</head>

<body>

<div class="heart-bg" id="heartBg"></div>

<header>
  ❤️ ふたりのホームページ ❤️
</header>

<div class="container">

  <div id="passwordScreen" class="card">
    <h2>合言葉</h2>
    <input id="passwordInput" type="password" placeholder="合言葉を入力">
    <br><br>
    <button onclick="checkPassword()">入る</button>
    <p id="passwordError" class="error"></p>
  </div>

  <div id="nameScreen" class="card hidden">
    <h2>どっち？</h2>
    <button onclick="selectUser('ゆうき')">ゆうき</button>
    <button onclick="selectUser('さき')">さき</button>
  </div>

  <div id="homeScreen" class="hidden">

    <div class="card">
      <h2 id="welcome"></h2>
      <p>今日も来てくれてありがとう♡</p>
    </div>

    <div class="top-grid">

      <div class="card">
        <h2>付き合ってから</h2>
        <div class="days" id="days"></div>
      </div>

      <div class="card">
        <h2>好きカウンター</h2>
        <div class="counter" id="loveCount">0</div>
        <button onclick="addLove(event)">❤️ 好き！</button>
      </div>

    </div>

    <div class="card">
      <h2>メニュー</h2>
      <div class="menu">
        <a href="album.html">
          <button>📷 アルバム</button>
        </a>
        <a href="diary.html">
          <button>📖 交換日記</button>
        </a>
      </div>
    </div>

    <div class="card message">
      ❤️ ふたりのメッセージ ❤️
      <p>これからもずっと一緒だよ♡</p>
    </div>

  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase,
  ref,
  onValue,
  runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDTblb_F8TYSloI-WcKrXGCtQdDFFGTx3k",
  authDomain: "hutari-3a6c1.firebaseapp.com",
  databaseURL: "https://hutari-3a6c1-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "hutari-3a6c1",
  storageBucket: "hutari-3a6c1.firebasestorage.app",
  messagingSenderId: "637601321157",
  appId: "1:637601321157:web:93c60f5dc40ba66c61a0ac",
  measurementId: "G-GJ45GRHSJ0"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const loveRef = ref(db, "loveCount");

const correctPassword = "ys";
const anniversary = new Date("2025-12-15");

window.checkPassword = function(){
  const input = document.getElementById("passwordInput").value.toLowerCase();

  if(input === correctPassword.toLowerCase()){
    document.getElementById("passwordScreen").classList.add("hidden");
    document.getElementById("nameScreen").classList.remove("hidden");
    localStorage.setItem("passedPassword","true");
  }else{
    document.getElementById("passwordError").textContent = "合言葉が違うよ";
  }
};

window.selectUser = function(name){
  localStorage.setItem("userName",name);
  showHome(name);
};

function showHome(name){
  document.getElementById("nameScreen").classList.add("hidden");
  document.getElementById("homeScreen").classList.remove("hidden");
  document.getElementById("welcome").textContent = name + "、おかえり♡";
}

const today = new Date();
const diff = Math.floor((today - anniversary) / (1000 * 60 * 60 * 24));
document.getElementById("days").textContent = diff + "日";

onValue(loveRef, (snapshot)=>{
  const count = snapshot.val() || 0;
  document.getElementById("loveCount").textContent = count;
});

window.addLove = function(event){
  runTransaction(loveRef, (current)=>{
    return (current || 0) + 1;
  });

  createPopHearts(event.clientX, event.clientY);
};

function createPopHearts(x,y){
  for(let i=0;i<8;i++){
    const heart = document.createElement("div");
    heart.className = "pop-heart";
    heart.textContent = Math.random() > .5 ? "♡" : "❤";

    heart.style.left = x + (Math.random() * 80 - 40) + "px";
    heart.style.top = y + (Math.random() * 30 - 15) + "px";

    document.body.appendChild(heart);

    setTimeout(()=>{
      heart.remove();
    },1000);
  }
}

function createBackgroundHearts(){
  const bg = document.getElementById("heartBg");

  for(let i=0;i<22;i++){
    const heart = document.createElement("div");
    heart.className = "bg-heart";
    heart.textContent = Math.random() > .5 ? "♡" : "❤";

    heart.style.left = Math.random() * 100 + "%";
    heart.style.fontSize = 14 + Math.random() * 22 + "px";
    heart.style.animationDuration = 8 + Math.random() * 8 + "s";
    heart.style.animationDelay = Math.random() * 8 + "s";

    bg.appendChild(heart);
  }
}

window.onload = function(){
  createBackgroundHearts();

  const passed = localStorage.getItem("passedPassword");
  const name = localStorage.getItem("userName");

  if(passed === "true" && name){
    document.getElementById("passwordScreen").classList.add("hidden");
    showHome(name);
  }else if(passed === "true"){
    document.getElementById("passwordScreen").classList.add("hidden");
    document.getElementById("nameScreen").classList.remove("hidden");
  }
};
</script>

</body>
</html>
