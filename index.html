<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ふたりのホームページ</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:#fff5f8;
    color:#333;
    text-align:center;
}

header{
    background:#ffb6c1;
    padding:20px;
    color:white;
    font-size:28px;
    font-weight:bold;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    margin:20px 0;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.days{
    font-size:32px;
    font-weight:bold;
    color:#ff4f7a;
}

.counter{
    font-size:40px;
    color:#ff4f7a;
    margin:15px 0;
}

button{
    border:none;
    border-radius:15px;
    padding:12px 20px;
    font-size:18px;
    cursor:pointer;
    background:#ff8fab;
    color:white;
}

button:hover{
    opacity:0.9;
}

.menu{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
}

.menu a{
    text-decoration:none;
}

.menu button{
    min-width:150px;
}

footer{
    margin-top:30px;
    color:#888;
    font-size:14px;
}
</style>
</head>

<body>

<header>
❤️ ふたりのホームページ ❤️
</header>

<div class="container">

    <div class="card">
        <h2>付き合ってから</h2>
        <div class="days" id="days"></div>
    </div>

    <div class="card">
        <h2>好きカウンター</h2>

        <div class="counter" id="loveCount">0</div>

        <button onclick="addLove()">
            ❤️ 好き！
        </button>
    </div>

    <div class="card">
        <h2>メニュー</h2>

        <div class="menu">

            <a href="album.html">
                <button>📷 アルバム</button>
            </a>

            <a href="diary.html">
                <button>📖 交換日記</button>
            </a>

        </div>
    </div>

</div>

<footer>
ふたり専用ページ
</footer>

<script>

//付き合い始めた日を入力
const anniversary = new Date("2025-12-15");

const today = new Date();

const diff =
Math.floor(
(today - anniversary) /
(1000 * 60 * 60 * 24)
);

document.getElementById("days").textContent =
`${diff}日`;

let loveCount =
localStorage.getItem("loveCount") || 0;

document.getElementById("loveCount").textContent =
loveCount;

function addLove(){

    loveCount++;

    localStorage.setItem(
        "loveCount",
        loveCount
    );

    document.getElementById("loveCount").textContent =
    loveCount;
}

</script>

</body>
</html>
